spring:
  application:
    name: school-portal-results

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/school_portal}
    username: ${SPRING_DATASOURCE_USERNAME:portal_user}
    password: ${SPRING_DATASOURCE_PASSWORD:portal_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PortalHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

logging:
  level:
    com.school.portal: INFO
    org.flywaydb: INFO
